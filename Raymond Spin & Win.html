<title>Raymond Spin & Win</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one centred column on a porcelain suiting-cloth ground — logo, title, the wheel as the single bold object, one action. Single light theme by design. */
:root{
  color-scheme: light;
  --porcelain:#F8F6F4;
  --cloth:#EFEBE8;
  --charcoal:#211E1F;
  --ash:#6F676A;
  --red:#ED1A3A;
  --wine:#8E0F26;
  --blush:#E9CFCF;
  --white:#FFFFFF;
  --display:"Playfair Display","Georgia","Times New Roman",serif;
  --body:"Jost","Avenir Next","Century Gothic","Segoe UI",sans-serif;
  --wheel:min(86vw,52vh,500px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--porcelain);color:var(--charcoal);font-family:var(--body);
  background-image:
    radial-gradient(60% 42% at 50% 56%, rgba(233,207,207,.55), rgba(248,246,244,0) 70%),
    repeating-linear-gradient(60deg, rgba(33,30,31,.022) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(-60deg, rgba(33,30,31,.022) 0 2px, transparent 2px 9px);
  -webkit-tap-highlight-color:transparent;
}
.page{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  gap:clamp(10px,2.2vh,22px);padding-inline:16px;padding-block:clamp(14px,2.6vh,30px);
}
.logo{width:clamp(120px,30vw,168px);display:block;box-shadow:0 10px 26px -14px rgba(142,15,38,.55);background:none;border:0;padding:0;cursor:default}
.logo svg{display:block;width:100%;height:auto}
.head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.eyebrow{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ash);font-weight:500;display:flex;align-items:center;gap:12px}
.eyebrow::before,.eyebrow::after{content:"";width:26px;border-top:1px dashed var(--ash)}
h1{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(2.5rem,9.5vw,4.2rem);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 b{font-weight:600;font-style:normal;color:var(--red)}
.sub{margin:0;color:var(--ash);font-size:clamp(.92rem,2.6vw,1.02rem)}

.stage{position:relative;width:var(--wheel);height:var(--wheel);flex:none;max-width:100%}
.stage::after{content:"";position:absolute;left:8%;right:8%;bottom:-5%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(33,30,31,.28),rgba(33,30,31,0));z-index:0}
.wheel{position:absolute;inset:0;z-index:1;will-change:transform;transform:rotate(0deg);
  transition:transform var(--dur,6.4s) cubic-bezier(.13,.7,.07,1);border-radius:50%;
  box-shadow:0 22px 40px -22px rgba(33,30,31,.55)}
.wheel svg{display:block;width:100%;height:100%}
.seg-label{font-family:var(--body);font-weight:600;font-size:16.5px;letter-spacing:2.2px;text-anchor:middle}
.pointer{position:absolute;z-index:3;left:50%;top:-3.2%;width:11%;transform:translateX(-50%);transform-origin:50% 12%;filter:drop-shadow(0 5px 5px rgba(33,30,31,.3))}
.spinning .pointer{animation:tick .2s ease-in-out infinite alternate}
@keyframes tick{from{transform:translateX(-50%) rotate(-7deg)}to{transform:translateX(-50%) rotate(5deg)}}
.hub{position:absolute;z-index:2;left:50%;top:50%;width:23%;height:23%;transform:translate(-50%,-50%);border-radius:50%;
  border:0;background:var(--white);color:var(--charcoal);font-family:var(--body);font-weight:600;font-size:clamp(.7rem,2.6vw,.95rem);letter-spacing:.24em;text-indent:.24em;
  box-shadow:0 0 0 5px var(--charcoal),0 0 0 6px var(--blush),0 10px 18px rgba(33,30,31,.35);cursor:pointer}
.hub::before{content:"";position:absolute;inset:7%;border-radius:50%;border:1px dashed rgba(33,30,31,.35)}

.cta{appearance:none;border:0;cursor:pointer;font-family:var(--body);font-weight:600;font-size:1.02rem;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
  color:var(--white);background:var(--red);padding:18px 34px;border-radius:999px;min-width:min(100%,280px);
  box-shadow:0 16px 28px -14px rgba(237,26,58,.8), inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .15s ease, background .2s ease}
.cta:active{transform:scale(.97)}
.cta[disabled]{background:var(--charcoal);box-shadow:none;cursor:default}
button:focus-visible{outline:2px solid var(--charcoal);outline-offset:4px}
.foot{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.gifts{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;color:var(--ash);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;max-width:460px}

.veil{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(33,30,31,.5);opacity:0;transition:opacity .35s ease}
.veil.show{opacity:1}
.card{position:relative;width:min(100%,430px);background:var(--porcelain);border-radius:6px;padding:38px 26px 28px;text-align:center;
  box-shadow:0 40px 80px -30px rgba(33,30,31,.7);transform:translateY(18px) scale(.96);transition:transform .5s cubic-bezier(.2,.9,.2,1);
  display:flex;flex-direction:column;align-items:center;gap:12px}
.veil.show .card{transform:none}
.card::before{content:"";position:absolute;inset:9px;border:1px dashed rgba(33,30,31,.28);border-radius:3px;pointer-events:none}
.card .hi{font-size:1.05rem;color:var(--wine);margin:0}
.card .won{font-size:.74rem;letter-spacing:.34em;text-transform:uppercase;color:var(--ash);margin:0}
.card .prize{font-family:var(--display);font-style:normal;font-weight:700;letter-spacing:.005em;color:var(--red);font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:2px 0 6px;text-wrap:balance}
.card .note{margin:0 0 8px;color:var(--ash);font-size:.95rem;max-width:30ch}
.card .cta{background:var(--charcoal);box-shadow:none;font-size:.86rem;padding:15px 28px}

.tally{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(33,30,31,.5)}
.tally .box{width:min(100%,360px);background:var(--white);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tally h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.5rem}
.tally table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tally td{padding:7px 0;border-bottom:1px solid var(--cloth)}
.tally td:last-child{text-align:right;font-weight:600}
.tally .row{display:flex;gap:10px;flex-wrap:wrap}
.tally button{flex:1;appearance:none;border:1px solid var(--charcoal);background:var(--white);color:var(--charcoal);font-family:var(--body);font-weight:500;padding:11px 12px;border-radius:999px;cursor:pointer}
.tally button.dark{background:var(--charcoal);color:var(--white)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:25;pointer-events:none}
@media (prefers-reduced-motion:reduce){.wheel{--dur:1.2s}.spinning .pointer{animation:none}.veil,.card{transition:none}}
</style>

    <p class="hi">बधाई हो! Congratulations</p>
    <p class="won">You have won a</p>
    <p class="prize" id="prize"></p>
    <p class="note">Please show this screen at the counter to collect your gift.</p>
    <button class="cta" id="next" type="button">Next customer</button>
  </div>
</div>

<div class="tally" id="tally" hidden>
  <div class="box">
    <h2>Gifts given on this device</h2>
    <table id="tallyRows"></table>
    <div class="row">
      <button type="button" id="tallyReset">Reset count</button>
      <button type="button" class="dark" id="tallyClose">Close</button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- Prizes. "weight" sets the chance: 1 each = equal chance. e.g. weight 0.2 = five times rarer. ----
  var PRIZES = [
    {name:"Trolley Bag",   weight:1},
    {name:"Towel",         weight:1},
    {name:"Duffle Bag",    weight:1},
    {name:"Pocket Square", weight:1},
    {name:"Bedsheet",      weight:1},
    {name:"Sling Bag",     weight:1}
  ];
  var FILL = ["#ED1A3A","#F8F6F4","#211E1F"];
  var INK  = ["#FFFFFF","#211E1F","#F8F6F4"];
  var N = PRIZES.length, STEP = 360/N;

  function pt(r,deg){var t=deg*Math.PI/180;return (r*Math.sin(t)).toFixed(2)+" "+(-r*Math.cos(t)).toFixed(2);}
  function arc(r,a,b){return "M"+pt(r,a)+" A"+r+" "+r+" 0 0 1 "+pt(r,b);}

  // ---- Draw the wheel once (SVG); spinning only rotates one GPU layer ----
  var s = '<svg viewBox="-200 -200 400 400" role="img" aria-label="Prize wheel">';
  s += '<circle r="199" fill="#211E1F"/><circle r="190.5" fill="none" stroke="#E9CFCF" stroke-width="1"/>';
  PRIZES.forEach(function(p,i){
    var c=i*STEP, a=c-STEP/2, b=c+STEP/2, ink=INK[i%3];
    s += '<path d="M0 0 L'+pt(180,a)+' A180 180 0 0 1 '+pt(180,b)+' Z" fill="'+FILL[i%3]+'"/>';
    s += '<path d="'+arc(170,a+3,b-3)+'" fill="none" stroke="'+ink+'" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="2 5"/>';
    var words = p.name.toUpperCase().split(" ");
    s += '<g transform="rotate('+c+')" fill="'+ink+'">';
    if(words.length>1){
      s += '<text class="seg-label" y="-134">'+words[0]+'</text><text class="seg-label" y="-112">'+words.slice(1).join(" ")+'</text>';
    } else {
      s += '<text class="seg-label" y="-124">'+words[0]+'</text>';
    }
    s += '<path d="M0 -84 l5 7 -5 7 -5 -7 Z" fill-opacity=".55"/></g>';
  });
  for(var k=0;k<N*2;k++){ s += '<circle cx="'+pt(189.5,k*STEP/2-STEP/2).split(" ")[0]+'" cy="'+pt(189.5,k*STEP/2-STEP/2).split(" ")[1]+'" r="'+(k%2?2.2:3.4)+'" fill="#F8F6F4"/>'; }
  s += '<circle r="52" fill="#211E1F" fill-opacity=".12"/></svg>';

  var wheel=document.getElementById("wheel"), stage=document.getElementById("stage");
  wheel.innerHTML = s;
  document.getElementById("gifts").innerHTML = PRIZES.map(function(p){return "<li>"+p.name+"</li>";}).join("");

  var btn=document.getElementById("spin"), hub=document.getElementById("hub"),
      veil=document.getElementById("veil"), prizeEl=document.getElementById("prize"), next=document.getElementById("next");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DUR = reduce ? 1200 : 6400, rot = 0, busy = false;

  function pick(){
    var total=0,i; for(i=0;i<N;i++) total+=PRIZES[i].weight;
    var r=Math.random()*total; for(i=0;i<N;i++){ r-=PRIZES[i].weight; if(r<0) return i; }
    return N-1;
  }

  function spin(){
    if(busy) return; busy = true;
    var i = pick();
    var target = ((-i*STEP + (Math.random()*36-18)) % 360 + 360) % 360;
    var cur = ((rot % 360) + 360) % 360, delta = target - cur; if(delta < 0) delta += 360;
    rot += 360*(reduce?1:6) + delta;
    btn.disabled = true; hub.disabled = true; btn.textContent = "Good luck…";
    stage.classList.add("spinning");
    wheel.style.transform = "rotate("+rot+"deg)";
    setTimeout(function(){ stage.classList.remove("spinning"); reveal(i); }, DUR + 250);
  }

  function reveal(i){
    prizeEl.textContent = PRIZES[i].name;
    veil.hidden = false; void veil.offsetWidth; veil.classList.add("show");
    count(PRIZES[i].name);
    try{ navigator.vibrate && navigator.vibrate([60,40,120]); }catch(e){}
    if(!reduce) confetti();
    setTimeout(function(){ try{ next.focus(); }catch(e){} }, 400);
  }

  function reset(){
    veil.classList.remove("show");
    setTimeout(function(){ veil.hidden = true; }, 350);
    btn.disabled = false; hub.disabled = false; btn.textContent = "Spin the wheel"; busy = false;
  }
  btn.addEventListener("click", spin); hub.addEventListener("click", spin); next.addEventListener("click", reset);

  // ---- Falling fabric swatches ----
  var fx=document.getElementById("fx"), ctx=fx.getContext("2d"), raf=0;
  function confetti(){
    cancelAnimationFrame(raf);
    var dpr=Math.min(window.devicePixelRatio||1,2), W=innerWidth, H=innerHeight;
    fx.width=W*dpr; fx.height=H*dpr; fx.hidden=false; ctx.setTransform(dpr,0,0,dpr,0,0);
    var cols=["#ED1A3A","#8E0F26","#211E1F","#E9CFCF","#FFFFFF"], P=[], n=W<600?70:120, j;
    for(j=0;j<n;j++) P.push({x:Math.random()*W,y:-20-Math.random()*H*.5,w:6+Math.random()*7,h:9+Math.random()*9,
      vy:2.4+Math.random()*3.2,vx:-1+Math.random()*2,a:Math.random()*6.28,va:-.12+Math.random()*.24,c:cols[j%cols.length]});
    var t0=performance.now();
    (function frame(t){
      var el=t-t0; ctx.clearRect(0,0,W,H); ctx.globalAlpha = el>2600 ? Math.max(0,1-(el-2600)/700) : 1;
      for(var q=0;q<P.length;q++){ var p=P[q]; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.scale(1,Math.cos(p.a*1.7)); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
      if(el<3300) raf=requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); fx.hidden=true; }
    })(t0);
  }

  // ---- Staff tally (this device only): tap the logo 5 times quickly ----
  var KEY="raymond-spin-tally";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
  function count(name){ var o=load(); o[name]=(o[name]||0)+1; save(o); }
  var tally=document.getElementById("tally"), taps=0, tapT=0;
  function showTally(){
    var o=load(), total=0, h="";
    PRIZES.forEach(function(p){ var c=o[p.name]||0; total+=c; h+="<tr><td>"+p.name+"</td><td>"+c+"</td></tr>"; });
    document.getElementById("tallyRows").innerHTML = h+"<tr><td><b>Total spins</b></td><td>"+total+"</td></tr>";
    tally.hidden=false;
  }
  document.getElementById("logo").addEventListener("click", function(){
    clearTimeout(tapT); taps++; tapT=setTimeout(function(){taps=0;},1200);
    if(taps>=5){ taps=0; showTally(); }
  });
  document.getElementById("tallyClose").addEventListener("click", function(){ tally.hidden=true; });
  document.getElementById("tallyReset").addEventListener("click", function(){ save({}); showTally(); });
})();
</script>

</body></html>
